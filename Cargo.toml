[package]
name = "mikocok"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.35.0", default-features = false, features = ["glow", "default_fonts"] }
egui_extras = "0.35.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
quick-xml = "0.37"
rfd = "0.17.2"
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
